<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixto AI | X-ZITH TECHNOLOGY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <button class="btn-new-chat"><i class="fas fa-plus"></i> New Chat</button>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search chats...">
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <!-- Added 'nav-link' class for JavaScript clicking -->
            <a href="#" class="nav-link active" data-view="chats"><i class="fas fa-comment"></i> Chats</a>
            <a href="#" class="nav-link" data-view="images"><i class="fas fa-image"></i> Image Gallery</a>
            <a href="#" class="nav-link" data-view="library"><i class="fas fa-book"></i> Library</a>
            <a href="#" class="nav-link" data-view="projects"><i class="fas fa-briefcase"></i> Projects</a>
        </nav>

        <div class="sidebar-history">
            <h4>Recent</h4>
            <ul id="chat-history-list">
                <li><i class="fas fa-message"></i> Welcome to Fixto AI</li>
            </ul>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- NEW: Top Header with Auth Buttons -->
        <header class="top-header">
            <div class="header-title">Fixto AI</div>
            <div class="auth-buttons">
                <button class="btn-auth btn-login">Log In</button>
                <button class="btn-auth btn-signup">Sign Up</button>
            </div>
        </header>

        <div class="chat-canvas" id="chat-canvas">
            <div class="welcome-screen" id="welcome-screen">
                <h1>Fixto AI</h1>
                <p>Powered by X-ZITH TECHNOLOGY. How can I help you today?</p>
            </div>
        </div>

        <!-- INPUT AREA -->
        <div class="input-area">
            <div class="input-box">
                <!-- NEW: Upload Button -->
                <button id="upload-btn" title="Attach image, file, or video">
                    <i class="fas fa-plus"></i>
                </button>
                <input type="file" id="file-input" hidden accept="image/*,video/*,.pdf,.doc,.docx,.txt">
                <span id="file-name" class="file-name-display"></span>

                <textarea id="user-input" placeholder="Message Fixto AI..." rows="1"></textarea>
                <div class="input-actions">
                    <button id="voice-btn" title="Voice Input"><i class="fas fa-microphone"></i></button>
                    <button id="send-btn" title="Send"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
