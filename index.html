<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixto AI | X-ZITH TECHNOLOGY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- OVERLAY (Closes menu when clicked) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- SLIDE-OUT MENU / SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Fixto AI</h2>
            <button id="close-sidebar" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        
        <button class="btn-new-chat"><i class="fas fa-plus"></i> New Chat</button>
        
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search chats...">
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-link active" data-view="chats"><i class="fas fa-comment"></i> Chats</a>
            <a href="#" class="nav-link" data-view="images"><i class="fas fa-image"></i> Image Gallery</a>
            <a href="#" class="nav-link" data-view="library"><i class="fas fa-book"></i> Library</a>
            <a href="#" class="nav-link" data-view="projects"><i class="fas fa-briefcase"></i> Projects</a>
        </nav>

        <div class="sidebar-history">
            <h4>Recent</h4>
            <ul id="chat-history-list">
                <li><i class="fas fa-message"></i> Welcome to Fixto AI</li>
            </ul>
        </div>

        <!-- USER PROFILE & EMAIL AT THE BOTTOM -->
        <div class="user-profile" id="user-profile-btn">
            <div class="user-avatar"><i class="fas fa-user"></i></div>
            <div class="user-info">
                <span class="user-email">promise@xzith.com</span> <!-- Replace with dynamic email later -->
                <span class="user-action">Settings <i class="fas fa-cog"></i></span>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- TOP HEADER WITH HAMBURGER MENU -->
        <header class="top-header">
            <button id="menu-toggle" class="menu-btn"><i class="fas fa-bars"></i></button>
            <div class="header-title">Fixto AI</div>
            <div class="auth-buttons">
                <button class="btn-auth btn-login">Log In</button>
                <button class="btn-auth btn-signup">Sign Up</button>
            </div>
        </header>

        <div class="chat-canvas" id="chat-canvas">
            <div class="welcome-screen" id="welcome-screen">
                <h1>Fixto AI</h1>
                <p>Powered by X-ZITH TECHNOLOGY. How can I help you today?</p>
            </div>
        </div>

        <!-- INPUT AREA -->
        <div class="input-area">
            <div class="input-box">
                <button id="upload-btn" title="Attach image, file, or video">
                    <i class="fas fa-plus"></i>
                </button>
                <input type="file" id="file-input" hidden accept="image/*,video/*,.pdf,.doc,.docx,.txt">
                <span id="file-name" class="file-name-display"></span>

                <textarea id="user-input" placeholder="Message Fixto AI..." rows="1"></textarea>
                <div class="input-actions">
                    <button id="voice-btn" title="Voice Input"><i class="fas fa-microphone"></i></button>
                    <button id="send-btn" title="Send"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </main>

    <!-- SETTINGS MODAL -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="close-modal" id="close-settings"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <span>Theme</span>
                    <select class="setting-select">
                        <option>Dark Mode</option>
                        <option>Light Mode</option>
                        <option>System</option>
                    </select>
                </div>
                <div class="setting-item">
                    <span>Save Chat History</span>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <span>Clear All Chats</span>
                    <button class="btn-danger">Clear Data</button>
                </div>
                <div class="setting-item">
                    <span>About</span>
                    <span class="setting-text">Fixto AI v1.0 by X-ZITH TECHNOLOGY</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
